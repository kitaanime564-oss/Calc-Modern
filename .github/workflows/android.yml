name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Mengarahkan perintah eksekusi ke dalam folder proyek Anda
      - name: Grant execute permission for gradlew
        run: chmod +x ./ModernCalculatorM3-Android-Project/gradlew
        
      - name: Build with Gradle
        run: ./gradlew assembleDebug
        working-directory: ./ModernCalculatorM3-Android-Project

      - name: Upload APK Matang
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-matang-debug
          path: ModernCalculatorM3-Android-Project/app/build/outputs/apk/debug/app-debug.apk
          
